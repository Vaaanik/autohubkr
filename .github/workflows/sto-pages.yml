# АвтоХаб: щодня оновлює відкриті сторінки сервісів (sto/), sitemap.xml і robots.txt з каталогу в базі.
name: Сторінки сервісів
on:
  schedule:
    - cron: '17 3 * * *'   # щодня о 05:17 за Києвом (взимку)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-sto-pages.mjs', '.github/workflows/sto-pages.yml']
permissions:
  contents: write
concurrency:
  group: sto-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-sto-pages.mjs
      - name: Зберегти зміни
        run: |
          git add -A sto sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git -c user.name="АвтоХаб бот" -c user.email="actions@users.noreply.github.com" commit -m "Сторінки сервісів: оновлення з каталогу"
          git pull --rebase -q origin main
          git push
